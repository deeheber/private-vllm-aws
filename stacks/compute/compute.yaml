AWSTemplateFormatVersion: "2010-09-09"
# For Fn::ToJsonString in ModelProfile. It's a macro, so deploys need CAPABILITY_AUTO_EXPAND.
Transform: AWS::LanguageExtensions
Description: Private GPU instance running vLLM, reached through SSM port forwarding.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet with a route to a NAT (or equivalent egress).
  InstanceType:
    Type: String
    Default: g5.xlarge
    AllowedValues: [g5.xlarge, g6.xlarge, g6e.xlarge]
  PurchaseOption:
    Type: String
    Default: spot
    AllowedValues: [spot, ondemand]
  # Model profile: these go only into the ModelProfile SSM parameter, never into
  # the launch template, so changing them doesn't replace the instance.
  VllmTag:
    Type: String
    Description: Pinned vllm/vllm-openai image tag.
  ModelId:
    Type: String
    Default: openai/gpt-oss-20b
  ServedModelName:
    Type: String
    Default: gpt-oss-20b
    AllowedPattern: ^[^/]+$
    ConstraintDescription: Must not contain "/" (vLLM rejects it for the Anthropic API).
  ToolCallParser:
    Type: String
    Default: openai
  MaxModelLen:
    Type: Number
    Default: 65536
    MinValue: 1
  ExtraVllmArgs:
    Type: String
    Default: ""
    Description: >-
      More vllm serve flags, split like a shell command line, such as
      --reasoning-parser qwen3.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Deep Learning Base OSS NVIDIA Driver GPU AMI (Ubuntu 22.04). Pinned so the
      AMI changes only when you change it; see docs/updating-compute.md.
  RootVolumeThroughput:
    Type: Number
    Default: 125
    MinValue: 125
    MaxValue: 1000
    Description: >-
      Root volume throughput in MB/s. 125 is included with gp3; more speeds up
      every model load and each new vLLM image (about $0.04 per extra MB/s per
      month). Changing it replaces the instance.

Conditions:
  IsSpot: !Equals [!Ref PurchaseOption, spot]
  # Unset at the default: setting Throughput changes the launch template, which replaces the instance.
  HasCustomThroughput: !Not [!Equals [!Ref RootVolumeThroughput, 125]]

Resources:
  ModelProfile:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/model-profile
      Description: vLLM model profile, read by the vllm service each time it starts.
      Type: String
      Value:
        Fn::ToJsonString:
          VllmTag: !Ref VllmTag
          ModelId: !Ref ModelId
          ServedModelName: !Ref ServedModelName
          ToolCallParser: !Ref ToolCallParser
          MaxModelLen: !Ref MaxModelLen
          ExtraVllmArgs: !Ref ExtraVllmArgs

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Bearer token for the vLLM API, generated by Secrets Manager.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-model-profile-and-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                # Ref returns the name with its leading "/".
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ModelProfile}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApiKeySecret

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: vLLM host - no inbound, access via SSM only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vllm

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 200
              VolumeType: gp3
              Throughput: !If [HasCustomThroughput, !Ref RootVolumeThroughput, !Ref AWS::NoValue]
              DeleteOnTermination: true
        InstanceMarketOptions: !If
          - IsSpot
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: persistent
              InstanceInterruptionBehavior: stop
              ValidUntil: "2027-12-31T23:59:59Z"
          - !Ref AWS::NoValue
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            mkdir -p /opt/hf-cache

            # Runs on every service start, so a profile change needs only a restart.
            cat > /usr/local/bin/vllm-launch <<'LAUNCH'
            #!/usr/bin/env python3
            import json, os, shlex, sys, time

            import boto3  # in the pinned Deep Learning AMI's system Python

            REGION = "${AWS::Region}"
            PROFILE_PARAM = "${ModelProfile}"
            SECRET_ID = "${ApiKeySecret}"

            def fetch():
                ssm = boto3.client("ssm", region_name=REGION)
                sm = boto3.client("secretsmanager", region_name=REGION)
                profile = ssm.get_parameter(Name=PROFILE_PARAM)["Parameter"]["Value"]
                key = sm.get_secret_value(SecretId=SECRET_ID)["SecretString"]
                return profile, key

            # IAM credentials and the network can lag at boot.
            for delay in (0, 5, 10, 20, 30, 60):
                time.sleep(delay)
                try:
                    profile, key = fetch()
                    break
                except Exception as e:
                    print(f"vllm-launch: reading the profile or key failed: {e}", file=sys.stderr)
            else:
                sys.exit(1)

            try:
                p = json.loads(profile)
                args = [
                    p["ModelId"],
                    "--served-model-name", p["ServedModelName"],
                    "--max-model-len", str(p["MaxModelLen"]),
                    "--enable-auto-tool-choice",
                    "--tool-call-parser", p["ToolCallParser"],
                    *shlex.split(p["ExtraVllmArgs"]),
                ]
                image = "vllm/vllm-openai:" + p["VllmTag"]
            except (ValueError, KeyError) as e:
                sys.exit(f"vllm-launch: bad model profile in {PROFILE_PARAM}: {e!r}")

            print(f"vllm-launch: {image} {shlex.join(args)}", file=sys.stderr)
            # A bare -e VLLM_API_KEY takes the value from this process's environment,
            # so the key isn't on any command line.
            os.execvpe("docker", [
                "docker", "run", "--rm", "--name", "vllm",
                "--runtime", "nvidia", "--gpus", "all", "--ipc=host",
                "-p", "127.0.0.1:8000:8000",
                "-e", "VLLM_NO_USAGE_STATS=1",
                "-e", "VLLM_API_KEY",
                "-v", "/opt/hf-cache:/root/.cache/huggingface",
                image, *args,
            ], {**os.environ, "VLLM_API_KEY": key})
            LAUNCH
            chmod 755 /usr/local/bin/vllm-launch

            cat > /etc/systemd/system/vllm.service <<'UNIT'
            [Unit]
            Description=vLLM server
            After=docker.service network-online.target
            Wants=network-online.target
            Requires=docker.service
            StartLimitIntervalSec=600
            StartLimitBurst=3

            [Service]
            Type=simple
            ExecStartPre=-/usr/bin/docker rm -f vllm
            ExecStart=/usr/local/bin/vllm-launch
            ExecStop=/usr/bin/docker stop -t 30 vllm
            TimeoutStopSec=60
            Restart=on-failure
            RestartSec=30

            [Install]
            WantedBy=multi-user.target
            UNIT

            systemctl enable --now docker
            systemctl daemon-reload
            systemctl enable --now vllm

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vllm

Outputs:
  InstanceId:
    Value: !Ref Instance
  AvailabilityZone:
    Value: !GetAtt Instance.AvailabilityZone
  ModelProfileParameter:
    Value: !Ref ModelProfile
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
