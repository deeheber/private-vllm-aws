AWSTemplateFormatVersion: "2010-09-09"
Description: Standalone VPC for the vLLM host. Skip it when bringing your own VPC.

Parameters:
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: AZ for the NAT gateway and the first private subnet.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PublicSubnetCidr:
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.16.0/20
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  # More private subnets, each in its own AZ, all routing through the one NAT.
  # Leave an AZ empty to skip that subnet.
  PrivateSubnetAz2:
    Type: String
    Default: ""
  PrivateSubnetAz3:
    Type: String
    Default: ""
  PrivateSubnetAz4:
    Type: String
    Default: ""
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.32.0/20
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PrivateSubnet3Cidr:
    Type: String
    Default: 10.0.48.0/20
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PrivateSubnet4Cidr:
    Type: String
    Default: 10.0.64.0/20
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

Conditions:
  HasPrivateSubnetAz2: !Not [!Equals [!Ref PrivateSubnetAz2, ""]]
  HasPrivateSubnetAz3: !Not [!Equals [!Ref PrivateSubnetAz3, ""]]
  HasPrivateSubnetAz4: !Not [!Equals [!Ref PrivateSubnetAz4, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: HasPrivateSubnetAz2
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref PrivateSubnetAz2
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-${PrivateSubnetAz2}

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasPrivateSubnetAz2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: HasPrivateSubnetAz3
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref PrivateSubnetAz3
      CidrBlock: !Ref PrivateSubnet3Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-${PrivateSubnetAz3}

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasPrivateSubnetAz3
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet4:
    Type: AWS::EC2::Subnet
    Condition: HasPrivateSubnetAz4
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref PrivateSubnetAz4
      CidrBlock: !Ref PrivateSubnet4Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-${PrivateSubnetAz4}

  PrivateSubnet4RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasPrivateSubnetAz4
    Properties:
      SubnetId: !Ref PrivateSubnet4
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
  PrivateSubnet2Id:
    Condition: HasPrivateSubnetAz2
    Value: !Ref PrivateSubnet2
  PrivateSubnet3Id:
    Condition: HasPrivateSubnetAz3
    Value: !Ref PrivateSubnet3
  PrivateSubnet4Id:
    Condition: HasPrivateSubnetAz4
    Value: !Ref PrivateSubnet4
  AvailabilityZone:
    Value: !Ref AvailabilityZone
